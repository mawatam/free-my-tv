name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK with script
        run: |
          echo "city=Kyiv" > config.properties
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          chmod +x build.sh
          ./build.sh
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-APK
          path: "*.apk"
